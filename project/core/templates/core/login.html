{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afillimetrics - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #0a0a0a;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .login-card {
            animation: slideUp 0.5s ease-out;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #2ECC71;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md">
            <!-- Logo -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white mb-2">Afillimetrics</h1>
                <p class="text-gray-400">Entre na sua conta</p>
            </div>

            <!-- Card de Login -->
            <div class="bg-[#1a1a1a] rounded-2xl shadow-xl p-8 border border-gray-800 login-card">
                <!-- Mensagens de feedback do Django -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="mb-4 p-3 rounded-lg {% if message.tags == 'success' %}bg-green-500/20 text-green-400 border border-green-500/50{% elif message.tags == 'error' %}bg-red-500/20 text-red-400 border border-red-500/50{% else %}bg-blue-500/20 text-blue-400 border border-blue-500/50{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post" action="{% url 'core:do_login' %}" class="space-y-6" id="loginForm">
                    {% csrf_token %}
                    
                    <!-- Campo E-mail -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-white mb-2">
                            E-mail
                        </label>
                        <input
                            type="email"
                            name="email"
                            id="email"
                            class="w-full px-4 py-3 rounded-lg bg-[#0a0a0a] border border-gray-700 text-white placeholder-gray-500 focus:border-[#2ECC71] focus:ring-2 focus:ring-[#2ECC71]/20 outline-none transition-all"
                            placeholder="seu@email.com"
                            required
                            autofocus
                        />
                    </div>

                    <!-- Campo Senha -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-white mb-2">
                            Senha
                        </label>
                        <div class="relative">
                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="w-full px-4 py-3 rounded-lg bg-[#0a0a0a] border border-gray-700 text-white placeholder-gray-500 focus:border-[#2ECC71] focus:ring-2 focus:ring-[#2ECC71]/20 outline-none transition-all pr-12"
                                placeholder="••••••••"
                                required
                            />
                            <button
                                type="button"
                                onclick="togglePassword()"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#2B7AEC] transition-colors"
                            >
                                <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Lembrar de mim -->
                    <div class="flex items-center">
                        <input
                            type="checkbox"
                            name="remember"
                            id="remember"
                            class="w-4 h-4 rounded border-gray-700 bg-[#0a0a0a] text-[#2ECC71] focus:ring-[#2ECC71] cursor-pointer"
                        />
                        <label for="remember" class="ml-2 text-sm text-gray-400 cursor-pointer">
                            Lembrar de mim
                        </label>
                    </div>

                    <!-- Botão Entrar -->
                    <button
                        type="submit"
                        id="submitBtn"
                        class="w-full py-3 bg-[#2B7AEC] text-white rounded-lg hover:bg-[#2563c7] transition-all shadow-md hover:shadow-lg font-semibold"
                    >
                        Entrar
                    </button>

                    <!-- Link Esqueci minha senha -->
                    <div class="text-center">
                        <a href="#" class="text-[#2ECC71] hover:text-[#27ae60] transition-colors text-sm">
                            Esqueci minha senha
                        </a>
                    </div>

                    <!-- Divisor -->
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-700"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-4 bg-[#1a1a1a] text-gray-500">ou</span>
                        </div>
                    </div>

                    <!-- Login com Google -->
                    <button
                        type="button"
                        class="w-full py-3 border-2 border-gray-700 rounded-lg hover:bg-[#0a0a0a] transition-all font-medium text-white flex items-center justify-center gap-3"
                    >
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Entrar com Google
                    </button>

                    <!-- Link Criar conta -->
                    <div class="text-center">
                        <span class="text-gray-400 text-sm">Não tem uma conta? </span>
                        <a href="#" class="text-[#2B7AEC] hover:text-[#5a9eef] transition-colors text-sm font-medium">
                            Criar conta
                        </a>
                    </div>
                </form>
            </div>

            <!-- Link voltar -->
            <div class="text-center mt-6">
                <a href="{% url 'core:landing_page' %}" class="text-gray-400 hover:text-white transition-colors text-sm flex items-center justify-center gap-1 mx-auto">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Voltar para home
                </a>
            </div>
        </div>
    </div>

    <script>
        let showPassword = false;
        
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            showPassword = !showPassword;
            passwordInput.type = showPassword ? 'text' : 'password';
            
            if (showPassword) {
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.977 9.977 0 0110.417-5.275M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                `;
            } else {
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                `;
            }
        }
        
        // Loading state no submit
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', function() {
                const submitBtn = document.getElementById('submitBtn');
                if (submitBtn) {
                    submitBtn.innerHTML = '<div class="flex items-center justify-center gap-2"><svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Entrando...</div>';
                    submitBtn.disabled = true;
                }
            });
        }
    </script>
</body>
</html>
